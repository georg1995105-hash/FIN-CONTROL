name: OCR model research (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_THREAD_LIMIT: "2"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU research dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-rus fonts-liberation
          # Ubuntu uses a different Liberation font path; resolve it on this runner.
          FONT=$(fc-match -f '%{file}' 'Liberation Sans:style=Regular')
          test -f "$FONT"
          sed -i "s|^FONT = .*|FONT = '$FONT'|" tools/ocr/number_probe.py
          python -m pip install 'paddlepaddle==3.2.0' 'paddleocr==3.2.0' 'paddlex==3.2.1' 'pyarrow==21.0.0' 'huggingface-hub==0.34.4' 'Pillow==11.3.0'
          python -m pip check
      - name: Compare models on synthetic and annotated receipt crops
        run: python tools/ocr/paddle_comparison.py
      - name: Preserve aggregate results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-model-research
          path: paddle_*_results.json
          if-no-files-found: warn
          retention-days: 7
