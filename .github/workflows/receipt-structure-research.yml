name: Receipt structure research (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OMP_THREAD_LIMIT: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install 'paddlepaddle==3.2.0' 'paddleocr==3.2.0' 'paddlex==3.2.1' 'pyarrow==21.0.0' 'huggingface-hub==0.34.4' 'Pillow==11.3.0'
          python -m pip check
      - name: Test candidate extraction and compile research code
        run: |
          python -m py_compile tools/ocr/receipt_structure.py tools/ocr/document_structure.py tools/ocr/total_candidate.py
          python tools/ocr/total_candidate.py
          python tools/ocr/document_structure.py
      - name: Detect and recognize whole receipts
        run: python tools/ocr/receipt_structure.py
      - name: Preserve aggregate results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipt-structure-research
          path: receipt_structure*results.json
          if-no-files-found: error
          retention-days: 7
