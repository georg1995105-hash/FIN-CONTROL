name: Android offline shell build
on:
  workflow_dispatch:
  push:
    branches: [feature/android-shell-20261126]
    paths:
      - "app/**"
      - "core/src/main/kotlin/**"
      - ".github/workflows/android-shell.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
permissions:
  contents: read
concurrency:
  group: fincontrol-android-shell
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android 35 compiler and platform
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build offline Android debug APK
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:lintDebug
      - name: Verify APK manifest, offline permission and artifact
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='pro.veor.fincontrol'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep "android.permission.INTERNET"; then
            echo "Unexpected network permission" >&2
            exit 1
          fi
          sha256sum "$APK"
          stat -c "APK bytes: %s" "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: fincontrol-shell-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
