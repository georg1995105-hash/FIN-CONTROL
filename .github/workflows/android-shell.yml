name: Android offline shell build
on:
  workflow_dispatch:
  push:
    branches: [feature/android-shell-20261126, feature/offline-russian-ocr-20261126, feature/invoice-end-to-end-20261127]
    paths:
      - "app/**"
      - "core/src/main/kotlin/**"
      - ".github/workflows/android-shell.yml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - "tools/android/**"
      - "core/src/test/kotlin/**"
permissions:
  contents: read
concurrency:
  group: fincontrol-android-shell
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 35 compiler and platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Fetch and verify pinned Russian OCR model for offline APK
        run: bash tools/android/prepare_tessdata.sh
      - name: Verify money extraction and financial core contracts (JDK 21)
        run: |
          curl -fL --retry 3 --silent --show-error \
            https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip \
            -o /tmp/kotlinc-1.9.0.zip
          unzip -q /tmp/kotlinc-1.9.0.zip -d /tmp/fin-kotlin
          /tmp/fin-kotlin/kotlinc/bin/kotlinc \
            core/src/main/kotlin/fincontrol/core/*.kt core/src/test/kotlin/fincontrol/core/*.kt \
            -include-runtime -d /tmp/fin-tests.jar
          for name in ReceiptAuditTest DocumentAuditTest ReceiptTotalReviewTest ReceiptOcrEvidenceTest InvoicePositionAuditTest; do
            java -cp /tmp/fin-tests.jar "fincontrol.core.${name}Kt"
          done
      - name: Build offline Android debug APK
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:lintDebug
      - name: Verify APK manifest, offline permission and artifact
        run: |
          set -eu
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -Z1 "$APK" | grep "^assets/tessdata/rus.traineddata$"
          unzip -Z1 "$APK" | grep -E "lib/arm64-v8a/libtesseract.so"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep "package: name='pro.veor.fincontrol'"
          if "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | grep "android.permission.INTERNET"; then
            echo "Unexpected network permission" >&2
            exit 1
          fi
          sha256sum "$APK"
          stat -c "APK bytes: %s" "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: fincontrol-shell-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
