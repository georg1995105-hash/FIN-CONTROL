name: Receipt layout diagnostics (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OMP_THREAD_LIMIT: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install 'numpy==2.4.6' 'Pillow==11.3.0'
      - name: Run unit tests before model dependencies
        run: |
          python -m py_compile tools/ocr/layout_diagnostic_run.py tools/ocr/layout_diagnostics.py tools/ocr/receipt_structure.py tools/ocr/document_structure.py tools/ocr/total_candidate.py tools/ocr/ocr_preprocess.py
          python tools/ocr/ocr_preprocess.py
          python tools/ocr/total_candidate.py
          python tools/ocr/document_structure.py
          python tools/ocr/layout_diagnostics.py
      - name: Install CPU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install 'paddlepaddle==3.2.0' 'paddleocr==3.2.0' 'paddlex==3.2.1' 'pyarrow==21.0.0' 'huggingface-hub==0.34.4' 'Pillow==11.3.0'
          python -m pip check
      - name: Verify unit tests after dependency resolution
        run: |
          python tools/ocr/ocr_preprocess.py
          python tools/ocr/total_candidate.py
          python tools/ocr/document_structure.py
          python tools/ocr/layout_diagnostics.py
      - name: Detect and recognize whole receipts
        run: python tools/ocr/layout_diagnostic_run.py
      - name: Preserve aggregate results only
        if: success() || hashFiles('layout_diagnostic*results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: receipt-layout-diagnostics
          path: layout_diagnostic*results.json
          if-no-files-found: error
          retention-days: 7
