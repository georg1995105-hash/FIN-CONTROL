name: File Manager feature-core tests
on:
  push:
    branches:
      - work/filemanager-plus-rebuild-20261127
    paths:
      - 'experimental/filemanager-plus/**'
      - '.github/workflows/filemanager-core-tests.yml'
  workflow_dispatch:
jobs:
  verify-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile portable modules
        run: |
          cd experimental/filemanager-plus
          mkdir -p build
          javac -encoding UTF-8 -d build src/fmplus/*.java test/fmplus/*.java
      - name: Test folder settings, backup, QR payload, TV focus
        run: java -cp experimental/filemanager-plus/build fmplus.FeatureCoreTest
      - name: Test Transfer-style LAN QR and bearer session lifecycle
        run: java -cp experimental/filemanager-plus/build fmplus.LanPairingTest
      - name: Test source-transplanted safe incoming transfer
        run: java -cp experimental/filemanager-plus/build fmplus.IncomingTransferTest
      - name: Test source-transplanted HTTP framing and origin validation
        run: java -cp experimental/filemanager-plus/build fmplus.HttpTransportTest
      - name: Test local copy, conflicts, progress, cancellation
        run: java -cp experimental/filemanager-plus/build fmplus.SafeTransferTest
      - name: Test QR V5 encoder
        run: java -cp experimental/filemanager-plus/build fmplus.QrMatrixTest "$RUNNER_TEMP/http-qr.pgm"
      - name: Validate V8.2 patch script (no APK distributed)
        run: |
          set -euo pipefail
          python -m py_compile experimental/filemanager-plus/scripts/patch_durable_preferences_v82.py
          tmp="$(mktemp -d)"
          export PATCH_TEST_TMP="$tmp"
          python - <<'PY'
          import os, zipfile, subprocess, sys
          from pathlib import Path
          tmp=Path(os.environ['PATCH_TEST_TMP'])
          apk=tmp/'invalid.apk'
          with zipfile.ZipFile(apk,'w') as f:
              f.writestr('classes.dex',b'not an APK')
              f.writestr('AndroidManifest.xml',b'not a manifest')
          out=tmp/'output.apk'
          run=subprocess.run([sys.executable,'experimental/filemanager-plus/scripts/patch_durable_preferences_v82.py',str(apk),str(out)],capture_output=True,text=True)
          assert run.returncode!=0, 'Unknown APK incorrectly accepted'
          assert not out.exists(), 'Unexpected APK produced from wrong input'
          print('PASS: V8.2 patch refuses an unknown APK')
          PY
      - name: Compile Android UI and media adapters
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          JAR="$(find "$SDK_ROOT/platforms" -maxdepth 2 -name android.jar | sort -V | tail -1)"
          if [ -z "$JAR" ]; then
            echo "Android SDK platform is not installed"; exit 1
          fi
          mkdir -p experimental/filemanager-plus/build/android
          javac -encoding UTF-8 -cp "$JAR:experimental/filemanager-plus/build" \
            -d experimental/filemanager-plus/build/android \
            experimental/filemanager-plus/androidsrc/fmplus/AndroidFeatures.java \
            experimental/filemanager-plus/androidsrc/fmplus/QrLocalTransfer.java \
            experimental/filemanager-plus/androidsrc/fmplus/QrExistingServer.java
